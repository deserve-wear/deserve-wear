<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deserve Wear - Premium Clothing Brand</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .card-box { background: #ffffff; border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05); }
        .search-shadow { box-shadow: 0 0 15px rgba(0, 0, 0, 0.08), 0 2px 5px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.08); }
        
        /* Footer Colorful Brand Name */
        .footer-brand { font-family: serif; font-style: italic; font-weight: 800; font-size: 1.6rem; }
        .fb-d { color: #dc2626; font-size: 2rem; }
        .fb-eserve { color: #4b5563; }
        .fb-w { color: #2563eb; font-size: 2rem; margin-left: 4px; }
        .fb-ear { color: #d97706; }
    </style>
</head>
<body class="text-neutral-900 antialiased flex flex-col min-h-screen">

    <!-- Sticky Header (Original Simple Black Brand Name) -->
    <header class="sticky top-0 z-50 px-3 pt-3">
        <div class="card-box relative mx-auto flex max-w-4xl items-center justify-between px-4 py-3 bg-white/95 backdrop-blur-md">
            <div class="flex items-center gap-3">
                <button onclick="toggleMenu()" class="p-2 rounded-xl hover:bg-neutral-100 transition">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                </button>
                <a href="index.html" class="flex items-baseline gap-1.5">
                    <span class="italic font-serif text-2xl font-bold tracking-tight text-neutral-900">Deserve</span>
                    <span class="uppercase text-[9px] tracking-[0.35em] font-sans font-semibold text-amber-600">Wear</span>
                </a>
            </div>
            <div>
                <a href="cart.html" class="flex items-center gap-2 bg-neutral-100 hover:bg-neutral-200 px-3.5 py-2 rounded-full text-sm font-medium transition">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg>
                    <span>কার্ট</span>
                    <span id="cart-count" class="bg-amber-600 text-white text-xs px-1.5 py-0.5 rounded-full">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Slide-over Menu Modal -->
    <div id="menu-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-start backdrop-blur-sm">
        <div class="bg-white w-80 h-full p-6 shadow-2xl flex flex-col justify-between animate-in slide-in-from-left duration-200">
            <div>
                <div class="flex justify-between items-center mb-6 border-b pb-4">
                    <h3 class="font-bold text-lg">অ্যাকাউন্ট ও মেনু</h3>
                    <button onclick="toggleMenu()" class="p-2 text-neutral-500 hover:text-black">✕</button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-neutral-500 mb-1">ইমেইল / ইউজারনেম</label>
                        <input type="text" placeholder="name@example.com" class="w-full bg-neutral-100 px-3 py-2 rounded-xl text-sm border-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-neutral-500 mb-1">পাসওয়ার্ড</label>
                        <input type="password" placeholder="••••••••" class="w-full bg-neutral-100 px-3 py-2 rounded-xl text-sm border-none">
                    </div>
                    <button onclick="alert('লগইন সফল হয়েছে!')" class="w-full bg-neutral-900 text-white py-2.5 rounded-xl font-medium text-sm hover:bg-neutral-800 transition">Sign In / Sign Up</button>
                    
                    <div class="relative flex py-2 items-center">
                        <div class="flex-grow border-t border-neutral-200"></div>
                        <span class="flex-shrink mx-4 text-neutral-400 text-xs">অথবা</span>
                        <div class="flex-grow border-t border-neutral-200"></div>
                    </div>

                    <button onclick="alert('Google Sign-In সফল!')" class="w-full flex items-center justify-center gap-2 border border-neutral-300 py-2.5 rounded-xl text-sm font-medium hover:bg-neutral-50 transition">
                        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.27v3.15C3.26 21.32 7.32 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.25c-.25-.72-.38-1.49-.38-2.25s.13-1.53.38-2.25V6.6H1.27C.46 8.22 0 10.05 0 12s.46 3.78 1.27 5.4l4.01-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.32 0 3.26 2.68 1.27 6.6l4.01 3.15c.95-2.84 3.6-4.95 6.72-4.95z"/></svg>
                        Login With Google
                    </button>
                </div>
            </div>
            <div class="text-center text-xs text-neutral-400 pb-4">Deserve Wear Secure Portal</div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-3 py-6 flex-1 w-full">
        <div class="mb-6 space-y-4">
            <h1 class="text-2xl font-bold px-1">সব প্রোডাক্ট</h1>
            
            <div class="flex gap-2">
                <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="প্রোডাক্ট খুঁজুন..." class="flex-1 bg-white card-box search-shadow px-4 py-3 text-sm focus:outline-none">
                <button onclick="filterProducts()" class="bg-neutral-900 text-white px-6 py-3 rounded-2xl font-medium text-sm hover:bg-neutral-800 transition">খুঁজুন</button>
            </div>

            <div class="flex gap-2 pt-1">
                <button onclick="setCategory('all')" id="cat-all" class="category-btn bg-neutral-900 text-white px-5 py-2 rounded-full text-xs font-semibold shadow-sm transition">ALL</button>
                <button onclick="setCategory('men')" id="cat-men" class="category-btn bg-white text-neutral-700 border border-neutral-200 px-5 py-2 rounded-full text-xs font-semibold hover:bg-neutral-100 transition">Men's 👕</button>
                <button onclick="setCategory('women')" id="cat-women" class="category-btn bg-white text-neutral-700 border border-neutral-200 px-5 py-2 rounded-full text-xs font-semibold hover:bg-neutral-100 transition">Women's 👗</button>
            </div>
        </div>

        <div id="product-grid" class="grid grid-cols-2 gap-4 sm:grid-cols-3"></div>
    </main>

    <!-- Footer (Left aligned text & options, Colorful Brand Name) -->
    <footer class="max-w-4xl mx-auto w-full px-3 mt-12 pb-8">
        <div class="card-box px-6 py-6 space-y-4 text-left">
            <div class="footer-brand inline-flex items-baseline">
                <span><span class="fb-d">D</span><span class="fb-eserve">eserve</span></span>
                <span class="ml-1.5"><span class="fb-w">W</span><span class="fb-ear">ear</span></span>
            </div>
            
            <!-- Left aligned compact boxed links -->
            <div class="flex flex-col items-start gap-2 max-w-[180px] py-2">
                <a href="index.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">All Products</a>
                <a href="cart.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">Cart</a>
                <a href="orders.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">My Order</a>
                <a href="track.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">Track Order</a>

            </div>

            <div class="pt-2 border-t border-neutral-100">
                <p class="text-xs font-bold tracking-widest text-amber-600 mb-3 uppercase">CONTACTS WITH US</p>
                <div class="flex items-center gap-3">
                    <a href="https://www.facebook.com/profile.php?id=61596776030542" target="_blank" class="flex items-center gap-1.5 bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-medium">🌐 ফেসবুক পেজ</a>
                    <a href="https://wa.me/8801877476659?text=Hello" target="_blank" class="flex items-center gap-1.5 bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-medium">💬 WhatsApp</a>
                </div>
            </div>
            
            <p class="text-xs text-neutral-400 pt-2">© 2026 Deserve Wear. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const products = [
            { id: 1, name: "Classic Cotton Tee", price: 450, oldPrice: 550, category: "men", hotSale: true, img: "https://i.ibb.co.com/rfHFcgXG/Screenshot-20261109-225115.jpg" },
            { id: 2, name: "Oversized Drop Shoulder Tee", price: 650, oldPrice: null, category: "men", hotSale: false, img: "https://i.ibb.co.com/WWfp4JFR/Screenshot-20261109-223334.jpg" },
            { id: 3, name: "Premium Fleece Hoodie", price: 1450, oldPrice: 1750, category: "women", hotSale: true, img: "https://i.ibb.co.com/7x6mMGZD/Screenshot-20261109-224612.jpg" },
            { id: 4, name: "Zipper Hoodie", price: 1650, oldPrice: 1800, category: "women", hotSale: false, img: "https://i.ibb.co.com/1Yngh2Wb/Screenshot-20261109-224322.jpg" }
        ];

        let currentCategory = 'all';

        function renderProducts(filterText = '') {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            let filtered = products.filter(p => {
                let matchesCategory = currentCategory === 'all' || p.category === currentCategory;
                let matchesSearch = p.name.toLowerCase().includes(filterText.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if(filtered.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center py-8 text-neutral-400 text-sm">কোনো প্রোডাক্ট পাওয়া যায়নি</p>';
                return;
            }

            filtered.forEach(p => {
                grid.innerHTML += `
                    <a href="product.html?id=${p.id}" class="card-box overflow-hidden block group transition transform active:scale-95 bg-white">
                        <div class="relative aspect-[4/5] bg-neutral-100 overflow-hidden">
                            <img src="${p.img}" class="object-cover w-full h-full group-hover:scale-105 transition duration-300">
                            ${p.hotSale ? '<span class="absolute top-2 left-2 bg-gradient-to-r from-red-600 to-amber-600 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full shadow">🔥 Hot Sale</span>' : ''}
                        </div>
                        <div class="p-3">
                            <h3 class="font-medium text-xs sm:text-sm line-clamp-1">${p.name}</h3>
                            <p class="mt-1 text-xs sm:text-sm"><span class="font-bold text-neutral-900">৳${p.price}</span> ${p.oldPrice ? `<span class="text-neutral-400 line-through ml-1 text-xs">৳${p.oldPrice}</span>` : ''}</p>
                        </div>
                    </a>
                `;
            });
            updateCartBadge();
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(b => {
                b.classList.remove('bg-neutral-900', 'text-white', 'shadow-sm');
                b.classList.add('bg-white', 'text-neutral-700', 'border', 'border-neutral-200');
            });
            const activeBtn = document.getElementById(`cat-${cat}`);
            activeBtn.classList.remove('bg-white', 'text-neutral-700', 'border', 'border-neutral-200');
            activeBtn.classList.add('bg-neutral-900', 'text-white', 'shadow-sm');
            renderProducts(document.getElementById('search-input').value);
        }

        function filterProducts() {
            renderProducts(document.getElementById('search-input').value);
        }

        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('deserve_cart')) || [];
            document.getElementById('cart-count').innerText = cart.length;
        }

        function toggleMenu() {
            const modal = document.getElementById('menu-modal');
            modal.classList.toggle('hidden');
        }

        renderProducts();
    </script>
</body>
</html>
