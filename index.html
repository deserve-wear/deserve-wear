<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deserve Wear - Premium Clothing Brand</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .card-box { background: #ffffff; border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body class="text-neutral-900 antialiased flex flex-col min-h-screen">

    <!-- Sticky Header -->
    <header class="sticky top-0 z-50 px-3 pt-3">
        <div class="card-box relative mx-auto flex max-w-4xl items-center justify-between px-4 py-3 bg-white/90 backdrop-blur-md">
            <div class="flex items-center gap-3">
                <button onclick="toggleMenu()" class="p-2 rounded-xl hover:bg-neutral-100 transition">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                </button>
                <a href="#" class="flex items-baseline gap-1.5">
                    <span class="italic font-serif text-2xl font-bold tracking-tight text-neutral-900">Deserve</span>
                    <span class="uppercase text-[9px] tracking-[0.35em] font-sans font-semibold text-amber-600">Wear</span>
                </a>
            </div>
            <div>
                <button onclick="openCartModal()" class="flex items-center gap-2 bg-neutral-100 hover:bg-neutral-200 px-3.5 py-2 rounded-full text-sm font-medium transition">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg>
                    <span>কার্ট</span>
                    <span id="cart-count" class="bg-amber-600 text-white text-xs px-1.5 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-3 py-6 flex-1 w-full">
        
        <!-- Search & Filter Section -->
        <div class="mb-6 space-y-4">
            <h1 class="text-2xl font-bold px-1">সব প্রোডাক্ট</h1>
            
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="প্রোডাক্টের নাম..." class="flex-1 bg-white card-box px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-neutral-900">
                <button onclick="filterProducts()" class="bg-neutral-900 text-white px-6 py-3 rounded-2xl font-medium text-sm hover:bg-neutral-800 transition">খুঁজুন</button>
            </div>

            <!-- Gender Highlight Options -->
            <div class="flex gap-2 pt-1">
                <button onclick="setCategory('all')" id="cat-all" class="category-btn bg-neutral-900 text-white px-4 py-2 rounded-full text-xs font-semibold shadow-sm transition">সকল</button>
                <button onclick="setCategory('men')" id="cat-men" class="category-btn bg-white text-neutral-700 border border-neutral-200 px-4 py-2 rounded-full text-xs font-semibold hover:bg-neutral-100 transition">Men's 👕</button>
                <button onclick="setCategory('women')" id="cat-women" class="category-btn bg-white text-neutral-700 border border-neutral-200 px-4 py-2 rounded-full text-xs font-semibold hover:bg-neutral-100 transition">Women's 👗</button>
            </div>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-2 gap-4 sm:grid-cols-3">
            <!-- Dynamic Products will load here -->
        </div>
    </main>

    <!-- Product Details Modal / View -->
    <div id="details-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] overflow-y-auto p-6 relative animate-in fade-in zoom-in duration-200">
            <button onclick="closeDetails()" class="absolute top-4 right-4 bg-neutral-100 hover:bg-neutral-200 p-2 rounded-full">✕</button>
            
            <div class="aspect-[4/5] bg-neutral-100 rounded-2xl overflow-hidden mb-4">
                <img id="modal-img" src="" class="w-full h-full object-cover">
            </div>

            <h2 id="modal-name" class="text-xl font-bold"></h2>
            <p id="modal-price" class="text-lg font-semibold mt-1"></p>

            <!-- Color Options Box -->
            <div class="mt-4">
                <label class="block text-xs font-semibold text-neutral-500 mb-2">রং: <span id="selected-color-text" class="text-neutral-900">Black</span></label>
                <div class="flex gap-2" id="color-options">
                    <button onclick="selectColor('Black', this)" class="color-btn px-4 py-2 rounded-xl border border-neutral-900 bg-neutral-900 text-white text-xs font-medium">Black</button>
                    <button onclick="selectColor('White', this)" class="color-btn px-4 py-2 rounded-xl border border-neutral-200 text-xs font-medium">White</button>
                </div>
            </div>

            <!-- Size Options Box -->
            <div class="mt-4">
                <label class="block text-xs font-semibold text-neutral-500 mb-2">সাইজ:</label>
                <div class="flex gap-2" id="size-options">
                    <button onclick="selectSize('S', this)" class="size-btn px-4 py-2 rounded-xl border border-neutral-200 text-xs font-medium">S</button>
                    <button onclick="selectSize('M', this)" class="size-btn px-4 py-2 rounded-xl border border-neutral-900 bg-neutral-900 text-white text-xs font-medium">M</button>
                    <button onclick="selectSize('L', this)" class="size-btn px-4 py-2 rounded-xl border border-neutral-200 text-xs font-medium">L</button>
                    <button onclick="selectSize('XL', this)" class="size-btn px-4 py-2 rounded-xl border border-neutral-200 text-xs font-medium">XL</button>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-3 mt-6">
                <button onclick="addToCartFromModal()" class="bg-neutral-900 text-white py-3 rounded-2xl font-medium text-sm hover:bg-neutral-800 transition">কার্টে যোগ করুন</button>
                <button onclick="buyNow()" class="bg-amber-600 text-white py-3 rounded-2xl font-medium text-sm hover:bg-amber-700 transition">এখনই কিনুন</button>
            </div>

            <!-- Chat Box Option -->
            <div class="mt-6 border-t pt-4 text-center">
                <a href="javascript:void(0)" onclick="openChat()" class="inline-block bg-emerald-50 text-emerald-700 border border-emerald-200 px-4 py-2.5 rounded-2xl text-sm font-semibold hover:bg-emerald-100 transition w-full">
                    💬 চ্যাট করুন
                    <span class="block text-[11px] text-emerald-600 font-normal mt-0.5">প্রোডাক্ট সম্পর্কে জানতে মেসেজ করুন</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[85vh] overflow-y-auto p-6 relative">
            <button onclick="closeCartModal()" class="absolute top-4 right-4 bg-neutral-100 p-2 rounded-full">✕</button>
            <h2 class="text-xl font-bold mb-4">আপনার কার্ট</h2>
            
            <div id="cart-items" class="space-y-3 mb-6">
                <!-- Cart items list -->
            </div>

            <!-- Checkout Form for Direct Order -->
            <div class="border-t pt-4 space-y-3">
                <h3 class="font-semibold text-sm">ডেলিভারির তথ্য দিন:</h3>
                <input type="text" id="cust-name" placeholder="আপনার নাম" class="w-full bg-neutral-100 px-4 py-2.5 rounded-xl text-sm border-none focus:ring-1 focus:ring-neutral-900">
                <input type="text" id="cust-phone" placeholder="মোবাইল নম্বর" class="w-full bg-neutral-100 px-4 py-2.5 rounded-xl text-sm border-none focus:ring-1 focus:ring-neutral-900">
                <textarea id="cust-address" placeholder="পূর্ণ ঠিকানা (বাসা, এলাকা, থানা, জেলা)" class="w-full bg-neutral-100 px-4 py-2.5 rounded-xl text-sm border-none focus:ring-1 focus:ring-neutral-900"></textarea>
                
                <button onclick="submitOrder()" class="w-full bg-neutral-900 text-white py-3 rounded-xl font-medium text-sm hover:bg-neutral-800 transition">অর্ডার কনফার্ম করুন (COD)</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto w-full px-3 mt-12 pb-8">
        <div class="card-box px-6 py-6 text-center text-sm text-neutral-600 space-y-2">
            <span class="italic font-serif text-xl font-bold text-neutral-900">Deserve Wear</span>
            <p>ক্যাশ অন ডেলিভারি। সারা বাংলাদেশে ডেলিভারি।</p>
            <p class="text-xs text-neutral-400">© 2026 Deserve Wear. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const products = [
            { id: 1, name: "Classic Cotton Tee", price: 450, oldPrice: 550, category: "men", img: "https://i.ibb.co.com/rfHFcgXG/Screenshot-20261109-225115.jpg" },
            { id: 2, name: "Oversized Drop Shoulder Tee", price: 650, oldPrice: null, category: "men", img: "https://i.ibb.co.com/WWfp4JFR/Screenshot-20261109-223334.jpg" },
            { id: 3, name: "Premium Fleece Hoodie", price: 1450, oldPrice: 1750, category: "women", img: "https://i.ibb.co.com/7x6mMGZD/Screenshot-20261109-224612.jpg" },
            { id: 4, name: "Zipper Hoodie", price: 1650, oldPrice: 1800, category: "women", img: "https://i.ibb.co.com/1Yngh2Wb/Screenshot-20261109-224322.jpg" }
        ];

        let currentCategory = 'all';
        let cart = [];
        let selectedProduct = null;
        let selectedSizeVal = 'M';
        let selectedColorVal = 'Black';
        const ownerWhatsApp = "01877476659";

        function renderProducts(filterText = '') {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            let filtered = products.filter(p => {
                let matchesCategory = currentCategory === 'all' || p.category === currentCategory;
                let matchesSearch = p.name.toLowerCase().includes(filterText.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if(filtered.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center py-8 text-neutral-400 text-sm">কোনো প্রোডাক্ট পাওয়া যায়নি</p>';
                return;
            }

            filtered.forEach(p => {
                grid.innerHTML += `
                    <div onclick="openDetails(${p.id})" class="card-box overflow-hidden cursor-pointer group transition transform active:scale-95 bg-white">
                        <div class="relative aspect-[4/5] bg-neutral-100 overflow-hidden">
                            <img src="${p.img}" class="object-cover w-full h-full group-hover:scale-105 transition duration-300">
                            ${p.oldPrice ? '<span class="absolute top-2 left-2 bg-red-600 text-white text-[10px] font-semibold px-2 py-0.5 rounded-full shadow">সেল</span>' : ''}
                        </div>
                        <div class="p-3">
                            <h3 class="font-medium text-xs sm:text-sm line-clamp-1">${p.name}</h3>
                            <p class="mt-1 text-xs sm:text-sm"><span class="font-bold text-neutral-900">৳${p.price}</span> ${p.oldPrice ? `<span class="text-neutral-400 line-through ml-1 text-xs">৳${p.oldPrice}</span>` : ''}</p>
                        </div>
                    </div>
                `;
            });
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(b => {
                b.classList.remove('bg-neutral-900', 'text-white', 'shadow-sm');
                b.classList.add('bg-white', 'text-neutral-700', 'border', 'border-neutral-200');
            });
            const activeBtn = document.getElementById(`cat-${cat}`);
            activeBtn.classList.remove('bg-white', 'text-neutral-700', 'border', 'border-neutral-200');
            activeBtn.classList.add('bg-neutral-900', 'text-white', 'shadow-sm');
            
            renderProducts(document.getElementById('search-input').value);
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value;
            renderProducts(query);
        }

        function openDetails(id) {
            selectedProduct = products.find(p => p.id === id);
            document.getElementById('modal-img').src = selectedProduct.img;
            document.getElementById('modal-name').innerText = selectedProduct.name;
            document.getElementById('modal-price').innerText = `৳${selectedProduct.price}`;
            document.getElementById('details-modal').classList.remove('hidden');
        }

        function closeDetails() {
            document.getElementById('details-modal').classList.add('hidden');
        }

        function selectSize(size, btn) {
            selectedSizeVal = size;
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('border-neutral-900', 'bg-neutral-900', 'text-white'));
            btn.classList.add('border-neutral-900', 'bg-neutral-900', 'text-white');
        }

        function selectColor(color, btn) {
            selectedColorVal = color;
            document.getElementById('selected-color-text').innerText = color;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('border-neutral-900', 'bg-neutral-900', 'text-white'));
            btn.classList.add('border-neutral-900', 'bg-neutral-900', 'text-white');
        }

        function addToCartFromModal() {
            cart.push({ ...selectedProduct, size: selectedSizeVal, color: selectedColorVal });
            updateCartCount();
            closeDetails();
            alert('প্রোডাক্টটি কারტে যোগ করা হয়েছে!');
        }

        function buyNow() {
            cart.push({ ...selectedProduct, size: selectedSizeVal, color: selectedColorVal });
            updateCartCount();
            closeDetails();
            openCartModal();
        }

        function updateCartCount() {
            document.getElementById('cart-count').innerText = cart.length;
        }

        function openCartModal() {
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            if(cart.length === 0) {
                container.innerHTML = '<p class="text-sm text-neutral-400 text-center py-4">আপনার কার্ট খালি</p>';
            } else {
                cart.forEach((item, index) => {
                    container.innerHTML += `
                        <div class="flex items-center justify-between bg-neutral-50 p-3 rounded-xl border border-neutral-100">
                            <div>
                                <h4 class="font-medium text-xs">${item.name}</h4>
                                <p class="text-[11px] text-neutral-500">কালার: ${item.color} | সাইজ: ${item.size}</p>
                                <p class="text-xs font-bold mt-1">৳${item.price}</p>
                            </div>
                            <button onclick="removeFromCart(${index})" class="text-red-500 text-xs">মুছুন</button>
                        </div>
                    `;
                });
            }
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function closeCartModal() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartCount();
            openCartModal();
        }

        function submitOrder() {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;

            if(!name || !phone || !address) {
                alert('দয়া করে আপনার নাম, ফোন নম্বর ও ঠিকানা দিন।');
                return;
            }

            let orderText = `🛍️ নতুন অর্ডার (Deserve Wear)%0A%0A👤 নাম: ${name}%0A📞 ফোন: ${phone}%0A📍 ঠিকানা: ${address}%0A%0A📦 প্রোডাক্টসমূহ:%0A`;
            let total = 0;
            cart.forEach((item, i) => {
                orderText += `${i+1}. ${item.name} (${item.color}, ${item.size}) - ৳${item.price}%0A`;
                total += item.price;
            });
            orderText += `%0A💰 মোট মূল্য: ৳${total}`;

            // Background message dispatch to owner's WhatsApp without redirecting customer directly
            const apiURL = `https://api.whatsapp.com/send?phone=${ownerWhatsApp}&text=${orderText}`;
            window.open(apiURL, '_blank');

            alert('আপনার অর্ডারটি সফলভাবে গৃহিত হয়েছে!');
            cart = [];
            updateCartCount();
            closeCartModal();
        }

        function openChat() {
            const msg = `হ্যালো, আমি "${selectedProduct.name}" প্রোডাক্টটি সম্পর্কে জানতে চাই।`;
            window.open(`https://api.whatsapp.com/send?phone=${ownerWhatsApp}&text=${encodeURIComponent(msg)}`, '_blank');
        }

        function toggleMenu() {
            alert('মেনু অপশন চালু আছে।');
        }

        // Initial Load
        renderProducts();
    </script>
</body>
</html>
