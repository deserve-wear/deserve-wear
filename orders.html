<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার অর্ডারসমূহ - Deserve Wear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .card-box { background: #ffffff; border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05); }
        .footer-brand { font-family: serif; font-style: italic; font-weight: 800; font-size: 1.6rem; }
        .fb-d { color: #dc2626; font-size: 2rem; }
        .fb-eserve { color: #4b5563; }
        .fb-w { color: #2563eb; font-size: 2rem; margin-left: 4px; }
        .fb-ear { color: #d97706; }
    </style>
</head>
<body class="text-neutral-900 antialiased flex flex-col min-h-screen">

    <header class="sticky top-0 z-50 px-3 pt-3">
        <div class="card-box relative mx-auto flex max-w-4xl items-center justify-between px-4 py-3 bg-white/95 backdrop-blur-md">
            <a href="index.html" class="flex items-center gap-1.5 text-sm font-semibold text-neutral-800 bg-neutral-100 hover:bg-neutral-200 px-3 py-1.5 rounded-xl transition">
                ← হোমপেজে ফিরে যান
            </a>
            <h1 class="text-sm font-bold text-neutral-900">আমার অর্ডারসমূহ</h1>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-3 py-8 flex-1 w-full space-y-6">
        <div class="card-box p-6 bg-white space-y-6">
            <h2 class="text-lg font-bold border-b pb-3">আপনার পার্চেস হিস্ট্রি ও ট্র্যাকিং</h2>
            
            <div id="orders-container" class="space-y-4">
                <!-- Orders will be dynamically loaded here with Tracking Codes -->
            </div>
        </div>

        <!-- Deserve Wear Brand Footer Card -->
        <div class="card-box px-6 py-6 space-y-4 text-left">
            <div class="footer-brand inline-flex items-baseline">
                <span><span class="fb-d">D</span><span class="fb-eserve">eserve</span></span>
                <span class="ml-1.5"><span class="fb-w">W</span><span class="fb-ear">ear</span></span>
            </div>
            <div class="flex flex-col items-start gap-2 max-w-[180px] py-2">
                <a href="products.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">All Products</a>
                <a href="cart.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">Cart</a>
                <a href="orders.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">My Order</a>
                <a href="track.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">Track Order</a>
            </div>
            <div class="pt-2 border-t border-neutral-100">
                <p class="text-xs font-bold tracking-widest text-amber-600 mb-3 uppercase">CONTACTS WITH US</p>
                <div class="flex items-center gap-3">
                    <a href="https://www.facebook.com/profile.php?id=61596776030542" target="_blank" class="flex items-center gap-1.5 bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-medium">🌐 ফেসবুক পেজ</a>
                    <a href="https://wa.me/8801877476659?text=Hello" target="_blank" class="flex items-center gap-1.5 bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-medium">💬 WhatsApp</a>
                </div>
            </div>
            <p class="text-xs text-neutral-400">© 2026 Deserve Wear. All rights reserved.</p>
        </div>
    </main>

    <script>
        // Sample or LocalStorage loaded orders with Tracking Codes
        function loadOrders() {
            const container = document.getElementById('orders-container');
            
            // Mock orders matching user's layout, now equipped with explicit Tracking Codes
            const orders = [
                {
                    id: "2",
                    trackingCode: "DW-TRK-84920",
                    status: "কনফার্মড",
                    items: [{ name: "Baby Cotton Romper", color: "Black", size: "M", qty: 1, price: 550 }],
                    name: "Alamin Ahmed",
                    phone: "01618281457",
                    total: 610
                },
                {
                    id: "1",
                    trackingCode: "DW-TRK-73105",
                    status: "কনফার্মড",
                    items: [
                        { name: "Oversized Drop Shoulder Tee", color: "Black", size: "M", qty: 2, price: 650 },
                        { name: "Zipper Hoodie", color: "Black", size: "L", qty: 1, price: 1650 },
                        { name: "Zipper Hoodie", color: "Black", size: "M", qty: 1, price: 1650 }
                    ],
                    name: "Alamin Ahmed",
                    phone: "01618281457",
                    total: 4660
                }
            ];

            container.innerHTML = '';

            orders.forEach(ord => {
                let itemsHtml = ord.items.map(i => `<p class="text-xs sm:text-sm text-neutral-700">${i.name} (${i.color}, সাইজ: ${i.size}) x ${i.qty} - ৳${i.price * i.qty}</p>`).join('');

                container.innerHTML += `
                    <div class="bg-neutral-50 border border-neutral-200 p-4 rounded-2xl space-y-3">
                        <div class="flex justify-between items-center border-b pb-2">
                            <div>
                                <span class="font-bold text-sm">অর্ডার #${ord.id}</span>
                                <span class="ml-2 bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded-md">ট্র্যাকিং কোড: ${ord.trackingCode}</span>
                            </div>
                            <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">${ord.status}</span>
                        </div>
                        <div class="space-y-1">
                            ${itemsHtml}
                        </div>
                        <div class="border-t pt-2 flex justify-between items-center text-xs sm:text-sm">
                            <span class="text-neutral-600">নাম: <b>${ord.name}</b> | ফোন: <b>${ord.phone}</b></span>
                            <span class="font-bold text-amber-600">মোট: ৳${ord.total}</span>
                        </div>
                    </div>
                `;
            });
        }

        loadOrders();
    </script>
</body>
</html>
