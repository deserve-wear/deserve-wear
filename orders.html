<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Deserve Wear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; } 
        .card-box { background: #ffffff; border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05); }
        .brand-gradient { background: linear-gradient(135deg, #f59e0b, #ec4899, #8b5cf6, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="text-neutral-900 antialiased flex flex-col min-h-screen">

    <header class="sticky top-0 z-50 px-3 pt-3">
        <div class="card-box relative mx-auto flex max-w-4xl items-center justify-between px-4 py-3 bg-white/95 backdrop-blur-md">
            <a href="index.html" class="text-sm font-medium text-neutral-600 hover:text-neutral-900 transition flex items-center gap-1">
                ← হোমপেজে ফিরে যান
            </a>
            <span class="font-bold text-base">আমার অর্ডারসমূহ</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-3 py-6 flex-1 w-full space-y-4">
        <div class="card-box p-6 bg-white">
            <h2 class="text-lg font-bold mb-4 pb-2 border-b">আপনার পার্চেস হিস্ট্রি</h2>
            <div id="orders-container" class="space-y-4">
                <!-- Orders list will load here -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto w-full px-3 mt-12 pb-8">
        <div class="card-box px-6 py-6 text-center space-y-4">
            <h2 class="text-2xl font-black italic font-serif brand-gradient">Deserve Wear</h2>
            <div class="flex flex-col gap-2 max-w-xs mx-auto py-2">
                <a href="index.html" class="bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 py-2.5 rounded-xl text-sm font-semibold text-neutral-800 transition shadow-sm">All Products</a>
                <a href="cart.html" class="bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 py-2.5 rounded-xl text-sm font-semibold text-neutral-800 transition shadow-sm">Cart</a>
                <a href="orders.html" class="bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 py-2.5 rounded-xl text-sm font-semibold text-neutral-800 transition shadow-sm">My Order</a>
            </div>
            <div class="pt-2 border-t border-neutral-100">
                <p class="text-xs font-bold tracking-widest text-amber-600 mb-3 uppercase">CONTACTS WITH US</p>
                <div class="flex justify-center items-center gap-4">
                    <a href="https://www.facebook.com/profile.php?id=61596776030542" target="_blank" class="flex items-center gap-1.5 bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-medium">🌐 ফেসবুক পেজ</a>
                    <a href="https://wa.me/8801877476659?text=Hello" target="_blank" class="flex items-center gap-1.5 bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-medium">💬 WhatsApp</a>
                </div>
            </div>
            <p class="text-xs text-neutral-400">© 2026 Deserve Wear.</p>
        </div>
    </footer>

    <script>
        function loadOrders() {
            let orders = JSON.parse(localStorage.getItem('deserve_orders')) || [];
            const container = document.getElementById('orders-container');
            container.innerHTML = '';

            if(orders.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 space-y-2">
                        <p class="text-neutral-400 text-sm font-medium">আপনার কোনো অর্ডার করা নেই!</p>
                        <p class="text-neutral-400 text-xs">আপনি কোনো প্রোডাক্ট অর্ডার করলে তা এখানে দেখতে পাবেন।</p>
                    </div>
                `;
                return;
            }

            orders.forEach((order, idx) => {
                let itemsHtml = '';
                order.items.forEach(item => {
                    itemsHtml += `<li class="text-xs text-neutral-600">${item.name} (${item.color}, সাইজ: ${item.size}) x ${item.qty || 1} - ৳${item.price * (item.qty || 1)}</li>`;
                });

                container.innerHTML += `
                    <div class="bg-neutral-50 p-4 rounded-2xl border border-neutral-100 space-y-2">
                        <div class="flex justify-between items-center text-xs font-bold text-neutral-500 border-b pb-2">
                            <span>অর্ডার #${orders.length - idx}</span>
                            <span class="text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">কনফার্মড</span>
                        </div>
                        <ul class="space-y-1 py-1">
                            ${itemsHtml}
                        </ul>
                        <div class="flex justify-between text-xs font-bold pt-2 border-t text-neutral-800">
                            <span>নাম: ${order.name} | ফোন: ${order.phone}</span>
                            <span class="text-amber-600">মোট: ৳${order.total}</span>
                        </div>
                    </div>
                `;
            });
        }
        loadOrders();
    </script>
</body>
</html>
