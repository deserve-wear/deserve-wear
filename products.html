<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products - Deserve Wear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; } 
        .card-box { background: #ffffff; border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05); }
        .footer-brand { font-family: serif; font-style: italic; font-weight: 800; font-size: 1.6rem; }
        .fb-d { color: #dc2626; font-size: 2rem; }
        .fb-eserve { color: #4b5563; }
        .fb-w { color: #2563eb; font-size: 2rem; margin-left: 4px; }
        .fb-ear { color: #d97706; }
    </style>
</head>
<body class="text-neutral-900 antialiased flex flex-col min-h-screen">

    <header class="sticky top-0 z-50 px-3 pt-3">
        <div class="card-box relative mx-auto flex max-w-4xl items-center justify-between px-4 py-3 bg-white/95 backdrop-blur-md">
            <a href="index.html" class="flex items-center gap-1.5 text-sm font-semibold text-neutral-800 bg-neutral-100 hover:bg-neutral-200 px-3 py-1.5 rounded-xl transition">
                ← Back
            </a>
            <a href="index.html" class="flex items-baseline gap-1.5">
                <span class="italic font-serif text-xl font-bold tracking-tight text-neutral-900">Deserve</span>
                <span class="uppercase text-[8px] tracking-[0.35em] font-sans font-semibold text-amber-600">Wear</span>
            </a>
            <a href="cart.html" class="flex items-center gap-2 bg-neutral-100 hover:bg-neutral-200 px-3.5 py-2 rounded-full text-sm font-medium transition">
                <span>কার্ট</span>
                <span id="cart-count" class="bg-amber-600 text-white text-xs px-1.5 py-0.5 rounded-full">0</span>
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-3 py-6 flex-1 w-full space-y-6">
        <div class="flex justify-between items-center px-1">
            <h1 class="text-2xl font-bold">সমস্ত প্রোডাক্ট</h1>
        </div>

        <!-- Filter Buttons: Men's, Women's, Baby -->
        <div class="flex gap-2">
            <button onclick="setCategory('all')" id="cat-all" class="category-btn bg-neutral-900 text-white px-4 py-2 rounded-full text-xs font-semibold shadow-sm transition">ALL</button>
            <button onclick="setCategory('men')" id="cat-men" class="category-btn bg-white text-neutral-700 border border-neutral-200 px-4 py-2 rounded-full text-xs font-semibold hover:bg-neutral-100 transition">Men's 👕</button>
            <button onclick="setCategory('women')" id="cat-women" class="category-btn bg-white text-neutral-700 border border-neutral-200 px-4 py-2 rounded-full text-xs font-semibold hover:bg-neutral-100 transition">Women's 👗</button>
            <button onclick="setCategory('baby')" id="cat-baby" class="category-btn bg-white text-neutral-700 border border-neutral-200 px-4 py-2 rounded-full text-xs font-semibold hover:bg-neutral-100 transition">Baby 🍼</button>
        </div>

        <div id="product-grid" class="grid grid-cols-2 gap-4 sm:grid-cols-3"></div>
    </main>

    <footer class="max-w-4xl mx-auto w-full px-3 mt-12 pb-8">
        <div class="card-box px-6 py-6 space-y-4 text-left">
            <div class="footer-brand inline-flex items-baseline">
                <span><span class="fb-d">D</span><span class="fb-eserve">eserve</span></span>
                <span class="ml-1.5"><span class="fb-w">W</span><span class="fb-ear">ear</span></span>
            </div>
            <div class="flex flex-col items-start gap-2 max-w-[180px] py-2">
                <a href="products.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">All Products</a>
                <a href="cart.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">Cart</a>
                <a href="orders.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">My Order</a>
                <a href="track.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">Track Order</a>
            </div>
            <div class="pt-2 border-t border-neutral-100">
                <p class="text-xs font-bold tracking-widest text-amber-600 mb-3 uppercase">CONTACTS WITH US</p>
                <div class="flex items-center gap-3">
                    <a href="https://www.facebook.com/profile.php?id=61596776030542" target="_blank" class="flex items-center gap-1.5 bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-medium">🌐 ফেসবুক পেজ</a>
                    <a href="https://wa.me/8801877476659?text=Hello" target="_blank" class="flex items-center gap-1.5 bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-medium">💬 WhatsApp</a>
                </div>
            </div>
            <p class="text-xs text-neutral-400">© 2026 Deserve Wear. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const products = [
            { id: 1, name: "Classic Cotton Tee", price: 450, oldPrice: 550, category: "men", hotSale: true, img: "https://i.ibb.co.com/rfHFcgXG/Screenshot-20261109-225115.jpg" },
            { id: 2, name: "Oversized Drop Shoulder Tee", price: 650, oldPrice: null, category: "men", hotSale: false, img: "https://i.ibb.co.com/WWfp4JFR/Screenshot-20261109-223334.jpg" },
            { id: 3, name: "Premium Fleece Hoodie", price: 1450, oldPrice: 1750, category: "women", hotSale: true, img: "https://i.ibb.co.com/7x6mMGZD/Screenshot-20261109-224612.jpg" },
            { id: 4, name: "Zipper Hoodie", price: 1650, oldPrice: 1800, category: "women", hotSale: false, img: "https://i.ibb.co.com/1Yngh2Wb/Screenshot-20261109-224322.jpg" },
            { id: 5, name: "Baby Soft Winter Suit", price: 850, oldPrice: 1000, category: "baby", hotSale: true, img: "https://i.ibb.co.com/rfHFcgXG/Screenshot-20261109-225115.jpg" },
            { id: 6, name: "Men's Formal Polo", price: 750, oldPrice: 900, category: "men", hotSale: false, img: "https://i.ibb.co.com/WWfp4JFR/Screenshot-20261109-223334.jpg" },
            { id: 7, name: "Women's Stylish Kurti", price: 1150, oldPrice: 1400, category: "women", hotSale: false, img: "https://i.ibb.co.com/7x6mMGZD/Screenshot-20261109-224612.jpg" },
            { id: 8, name: "Baby Cotton Romper", price: 550, oldPrice: 700, category: "baby", hotSale: true, img: "https://i.ibb.co.com/1Yngh2Wb/Screenshot-20261109-224322.jpg" }
        ];

        let currentCategory = 'all';

        function renderAllProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            let filtered = products.filter(p => currentCategory === 'all' || p.category === currentCategory);

            if(filtered.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center py-8 text-neutral-400 text-sm">কোনো প্রোডাক্ট পাওয়া যায়নি</p>';
                return;
            }

            filtered.forEach(p => {
                grid.innerHTML += `
                    <a href="product.html?id=${p.id}" class="card-box overflow-hidden block group transition transform active:scale-95 bg-white">
                        <div class="relative aspect-[4/5] bg-neutral-100 overflow-hidden">
                            <img src="${p.img}" class="object-cover w-full h-full group-hover:scale-105 transition duration-300">
                            ${p.hotSale ? '<span class="absolute top-2 left-2 bg-gradient-to-r from-red-600 to-amber-600 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full shadow">🔥 Hot Sale</span>' : ''}
                        </div>
                        <div class="p-3">
                            <h3 class="font-medium text-xs sm:text-sm line-clamp-1">${p.name}</h3>
                            <p class="mt-1 text-xs sm:text-sm"><span class="font-bold text-neutral-900">৳${p.price}</span> ${p.oldPrice ? `<span class="text-neutral-400 line-through ml-1 text-xs">৳${p.oldPrice}</span>` : ''}</p>
                        </div>
                    </a>
                `;
            });
            updateCartBadge();
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(b => {
                b.classList.remove('bg-neutral-900', 'text-white', 'shadow-sm');
                b.classList.add('bg-white', 'text-neutral-700', 'border', 'border-neutral-200');
            });
            const activeBtn = document.getElementById(`cat-${cat}`);
            activeBtn.classList.remove('bg-white', 'text-neutral-700', 'border', 'border-neutral-200');
            activeBtn.classList.add('bg-neutral-900', 'text-white', 'shadow-sm');
            renderAllProducts();
        }

        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('deserve_cart')) || [];
            document.getElementById('cart-count').innerText = cart.length;
        }

        renderAllProducts();
    </script>
</body>
</html>
