<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products - Deserve Wear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; } 
        .card-box { background: #ffffff; border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05); }
        .footer-brand { font-family: serif; font-style: italic; font-weight: 800; font-size: 1.6rem; }
        .fb-d { color: #dc2626; font-size: 2rem; }
        .fb-eserve { color: #4b5563; }
        .fb-w { color: #2563eb; font-size: 2rem; margin-left: 4px; }
        .fb-ear { color: #d97706; }
    </style>
</head>
<body class="text-neutral-900 antialiased flex flex-col min-h-screen">

    <!-- Sticky Header -->
    <header class="sticky top-0 z-50 px-3 pt-3">
        <div class="card-box relative mx-auto flex max-w-4xl items-center justify-between px-4 py-3 bg-white/95 backdrop-blur-md">
            <a href="index.html" class="flex items-center gap-1.5 text-sm font-semibold text-neutral-800 bg-neutral-100 hover:bg-neutral-200 px-3 py-1.5 rounded-xl transition">
                ← Back
            </a>
            <a href="index.html" class="flex items-baseline gap-1.5">
                <span class="italic font-serif text-xl font-bold tracking-tight text-neutral-900">Deserve</span>
                <span class="uppercase text-[8px] tracking-[0.35em] font-sans font-semibold text-amber-600">Wear</span>
            </a>
            <a href="cart.html" class="flex items-center gap-2 bg-neutral-100 hover:bg-neutral-200 px-3.5 py-2 rounded-full text-sm font-medium transition">
                <span>কার্ট</span>
                <span id="cart-count" class="bg-amber-600 text-white text-xs px-1.5 py-0.5 rounded-full">0</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-3 py-6 flex-1 w-full space-y-5">
        
        <!-- Header with Title & Search Icon -->
        <div class="flex flex-col gap-3">
            <div class="flex justify-between items-center px-1">
                <h1 class="text-2xl font-bold text-neutral-900">সমস্ত প্রডাক্ট</h1>
                
                <!-- Search Icon Button -->
                <button onclick="toggleSearchBox()" class="p-2.5 bg-white card-box hover:bg-neutral-50 transition flex items-center justify-center text-neutral-800 shadow-sm">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                </button>
            </div>

            <!-- Hidden/Toggleable Search Bar -->
            <div id="search-container" class="hidden transition-all duration-300">
                <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="প্রোডাক্ট খুঁজুন..." class="w-full bg-white card-box px-4 py-3 text-sm focus:outline-none border border-amber-500/50 shadow-sm">
            </div>

            <!-- Main Categories: Fashion (Default) & Cosmetics -->
            <div class="flex gap-2">
                <button onclick="selectMainCategory('fashion', this)" id="main-cat-fashion" class="main-cat-btn flex-1 py-2.5 rounded-xl text-xs font-bold bg-neutral-900 text-white transition shadow-sm text-center">👕 Fashion</button>
                <button onclick="selectMainCategory('cosmetics', this)" id="main-cat-cosmetics" class="main-cat-btn flex-1 py-2.5 rounded-xl text-xs font-bold bg-white border border-neutral-200 text-neutral-700 transition shadow-sm text-center">💄 Cosmetics</button>
            </div>

            <!-- Sub-Categories Row (Changes based on Main Category) -->
            <div id="sub-category-container" class="flex gap-2 overflow-x-auto pb-1 scrollbar-none">
                <!-- Dynamically populated via JavaScript -->
            </div>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-2 gap-4 sm:grid-cols-3"></div>

        <!-- Footer Card Box -->
        <div class="card-box px-6 py-6 space-y-4 text-left mt-8">
            <div class="footer-brand inline-flex items-baseline">
                <span><span class="fb-d">D</span><span class="fb-eserve">eserve</span></span>
                <span class="ml-1.5"><span class="fb-w">W</span><span class="fb-ear">ear</span></span>
            </div>
            <div class="flex flex-col items-start gap-2 max-w-[180px] py-2">
                <a href="products.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">All Products</a>
                <a href="cart.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">Cart</a>
                <a href="orders.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">My Order</a>
                <a href="track.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">Track Order</a>
            </div>
            <div class="pt-2 border-t border-neutral-100">
                <p class="text-xs font-bold tracking-widest text-amber-600 mb-3 uppercase">CONTACTS WITH US</p>
                <div class="flex items-center gap-3">
                    <a href="https://www.facebook.com/profile.php?id=61596776030542" target="_blank" class="flex items-center gap-1.5 bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-medium">🌐 ফেসবুক পেজ</a>
                    <a href="https://wa.me/8801877476659?text=Hello" target="_blank" class="flex items-center gap-1.5 bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-medium">💬 WhatsApp</a>
                </div>
            </div>
            <p class="text-xs text-neutral-400">© 2026 Deserve Wear. All rights reserved.</p>
        </div>
    </main>

    <!-- Connect shared products database -->
    <script src="products.js"></script>

    <script>
        let currentMainCat = 'fashion'; // Default Main Category
        let currentSubCat = 'all';     // Default Sub Category

        function toggleSearchBox() {
            const searchContainer = document.getElementById('search-container');
            searchContainer.classList.toggle('hidden');
            if(!searchContainer.classList.contains('hidden')) {
                document.getElementById('search-input').focus();
            }
        }

        function selectMainCategory(mainCat, btn) {
            currentMainCat = mainCat;
            
            // Style Main Category Buttons
            document.querySelectorAll('.main-cat-btn').forEach(b => {
                b.classList.remove('bg-neutral-900', 'text-white');
                b.classList.add('bg-white', 'border', 'border-neutral-200', 'text-neutral-700');
            });
            btn.classList.remove('bg-white', 'border', 'border-neutral-200', 'text-neutral-700');
            btn.classList.add('bg-neutral-900', 'text-white');

            // Set default sub-category based on main category
            if (mainCat === 'fashion') {
                currentSubCat = 'all';
            } else if (mainCat === 'cosmetics') {
                currentSubCat = 'women';
            }

            renderSubCategories();
            renderProducts();
        }

        function renderSubCategories() {
            const subContainer = document.getElementById('sub-category-container');
            subContainer.innerHTML = '';

            if (currentMainCat === 'fashion') {
                const fashionSubs = [
                    { id: 'all', name: 'All Fashion' },
                    { id: 'men', name: "Men's 👕" },
                    { id: 'women', name: "Women's 👗" },
                    { id: 'baby', name: 'Baby 🍼' }
                ];

                fashionSubs.forEach(sub => {
                    let isSelected = currentSubCat === sub.id;
                    subContainer.innerHTML += `
                        <button onclick="selectSubCategory('${sub.id}', this)" class="sub-cat-btn px-4 py-2 rounded-full text-xs font-bold transition whitespace-nowrap ${isSelected ? 'bg-neutral-900 text-white' : 'bg-white border border-neutral-200 text-neutral-700'}">${sub.name}</button>
                    `;
                });
            } else if (currentMainCat === 'cosmetics') {
                const cosmeticsSubs = [
                    { id: 'women', name: "Women's (Cosmetics) 💄" }
                ];

                cosmeticsSubs.forEach(sub => {
                    let isSelected = currentSubCat === sub.id;
                    subContainer.innerHTML += `
                        <button onclick="selectSubCategory('${sub.id}', this)" class="sub-cat-btn px-4 py-2 rounded-full text-xs font-bold transition whitespace-nowrap ${isSelected ? 'bg-neutral-900 text-white' : 'bg-white border border-neutral-200 text-neutral-700'}">${sub.name}</button>
                    `;
                });
            }
        }

        function selectSubCategory(subCat, btn) {
            currentSubCat = subCat;
            document.querySelectorAll('.sub-cat-btn').forEach(b => {
                b.classList.remove('bg-neutral-900', 'text-white');
                b.classList.add('bg-white', 'border', 'border-neutral-200', 'text-neutral-700');
            });
            btn.classList.remove('bg-white', 'border', 'border-neutral-200', 'text-neutral-700');
            btn.classList.add('bg-neutral-900', 'text-white');
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            const searchText = document.getElementById('search-input') ? document.getElementById('search-input').value.toLowerCase() : '';
            grid.innerHTML = '';

            let filtered = products.filter(p => {
                let pCat = (p.category || '').toLowerCase();
                let matchesMain = false;

                if (currentMainCat === 'fashion') {
                    matchesMain = (pCat === 'fashion' || pCat === 'men' || pCat === 'women' || pCat === 'baby');
                } else if (currentMainCat === 'cosmetics') {
                    matchesMain = (pCat === 'cosmetics');
                }

                let matchesSub = true;
                if (currentMainCat === 'fashion' && currentSubCat !== 'all') {
                    matchesSub = (pCat === currentSubCat);
                } else if (currentMainCat === 'cosmetics') {
                    matchesSub = (pCat === 'cosmetics' || pCat === 'women');
                }

                let matchesSearch = p.name.toLowerCase().includes(searchText);
                return matchesMain && matchesSub && matchesSearch;
            });

            if(filtered.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center py-12 text-neutral-400 text-sm">কোনো প্রডাক্ট পাওয়া যায়নি</p>';
                return;
            }

            filtered.forEach(p => {
                let displayImg = Array.isArray(p.images) ? p.images[0] : (p.img || '');
                grid.innerHTML += `
                    <a href="product.html?id=${p.id}" class="card-box overflow-hidden block group transition transform active:scale-95 bg-white">
                        <div class="relative aspect-[4/5] bg-neutral-100 overflow-hidden">
                            <img src="${displayImg}" class="object-cover w-full h-full group-hover:scale-105 transition duration-300">
                            ${p.hotSale ? '<span class="absolute top-2 left-2 bg-gradient-to-r from-red-600 to-amber-600 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full shadow">🔥 Hot Sale</span>' : ''}
                        </div>
                        <div class="p-3">
                            <h3 class="font-medium text-xs sm:text-sm line-clamp-1">${p.name}</h3>
                            <p class="mt-1 text-xs sm:text-sm"><span class="font-bold text-neutral-900">৳${p.price}</span> ${p.oldPrice ? `<span class="text-neutral-400 line-through ml-1 text-xs">৳${p.oldPrice}</span>` : ''}</p>
                        </div>
                    </a>
                `;
            });
            updateCartBadge();
        }

        function filterProducts() {
            renderProducts();
        }

        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('deserve_cart')) || [];
            document.getElementById('cart-count').innerText = cart.length;
        }

        // Initial Load
        renderSubCategories();
        renderProducts();
    </script>
</body>
</html>
