<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Product Details - Deserve Wear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; } 
        .card-box { background: #ffffff; border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05); }
        .footer-brand { font-family: serif; font-style: italic; font-weight: 800; font-size: 1.6rem; }
        .fb-d { color: #dc2626; font-size: 2rem; }
        .fb-eserve { color: #4b5563; }
        .fb-w { color: #2563eb; font-size: 2rem; margin-left: 4px; }
        .fb-ear { color: #d97706; }
    </style>
</head>
<body class="text-neutral-900 antialiased flex flex-col min-h-screen">

    <header class="sticky top-0 z-50 px-3 pt-3">
        <div class="card-box relative mx-auto flex max-w-4xl items-center justify-between px-4 py-3 bg-white/95 backdrop-blur-md">
            <a href="index.html" class="flex items-center gap-1.5 text-sm font-semibold text-neutral-800 bg-neutral-100 hover:bg-neutral-200 px-3 py-1.5 rounded-xl transition">
                ← Back
            </a>
            <a href="index.html" class="flex items-baseline gap-1.5">
                <span class="italic font-serif text-xl font-bold tracking-tight text-neutral-900">Deserve</span>
                <span class="uppercase text-[8px] tracking-[0.35em] font-sans font-semibold text-amber-600">Wear</span>
            </a>
            <a href="cart.html" class="flex items-center gap-2 bg-neutral-100 hover:bg-neutral-200 px-3.5 py-2 rounded-full text-sm font-medium transition">
                <span>কার্ট</span>
                <span id="cart-count" class="bg-amber-600 text-white text-xs px-1.5 py-0.5 rounded-full">0</span>
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-3 py-8 flex-1 w-full">
        <div class="card-box p-6 grid grid-cols-1 md:grid-cols-2 gap-8 items-start bg-white">
            
            <!-- Product Image Slider (Supports up to 4 images) -->
            <div class="space-y-3">
                <div class="relative aspect-[4/5] bg-neutral-100 rounded-2xl overflow-hidden shadow-sm">
                    <img id="prod-img" src="" class="w-full h-full object-cover transition-all duration-300">
                </div>
                <!-- Thumbnail Slider Navigation -->
                <div id="thumbnail-container" class="flex gap-2 overflow-x-auto pb-1">
                    <!-- Dynamic Thumbnails -->
                </div>
            </div>

            <div class="flex flex-col justify-between h-full space-y-4">
                <div>
                    <h1 id="prod-name" class="text-2xl font-bold text-neutral-900"></h1>
                    <p id="prod-price" class="mt-2 text-xl font-bold text-amber-600"></p>
                    
                    <!-- Color Options (Dynamic based on product) -->
                    <div class="mt-4">
                        <label class="block text-xs font-semibold text-neutral-500 mb-2">রং (অপশন): <span id="selected-color-text" class="text-neutral-900"></span></label>
                        <div class="flex gap-2 flex-wrap" id="color-options">
                            <!-- Dynamic Colors -->
                        </div>
                    </div>

                    <!-- Size Options -->
                    <div class="mt-4">
                        <label class="block text-xs font-semibold text-neutral-500 mb-2">সাইজ:</label>
                        <div class="flex gap-2">
                            <button onclick="selectSize('S', this)" class="size-btn px-3 py-2 rounded-xl border border-neutral-200 text-xs font-medium">S</button>
                            <button onclick="selectSize('M', this)" class="size-btn px-3 py-2 rounded-xl border border-neutral-900 bg-neutral-900 text-white text-xs font-medium">M</button>
                            <button onclick="selectSize('L', this)" class="size-btn px-3 py-2 rounded-xl border border-neutral-200 text-xs font-medium">L</button>
                            <button onclick="selectSize('XL', this)" class="size-btn px-3 py-2 rounded-xl border border-neutral-200 text-xs font-medium">XL</button>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-4">
                    <button onclick="addToCart()" class="bg-neutral-900 text-white py-3 rounded-2xl font-medium text-sm hover:bg-neutral-800 transition shadow-sm">কার্টে যোগ করুন</button>
                    <button onclick="buyNow()" class="bg-amber-600 text-white py-3 rounded-2xl font-medium text-sm hover:bg-amber-700 transition shadow-sm">এখনই কিনুন</button>
                </div>

                <!-- Chat Button & Full Details Section Below -->
                <div class="border-t pt-4 space-y-3">
                    <a href="javascript:void(0)" onclick="openChat()" class="inline-block bg-emerald-50 text-emerald-700 border border-emerald-200 px-4 py-3 rounded-2xl text-sm font-semibold hover:bg-emerald-100 transition w-full text-center">
                        💬 চ্যাট করুন
                        <span class="block text-[11px] text-emerald-600 font-normal mt-0.5">প্রোডাক্ট সম্পর্কে জানতে মেসেজ করুন</span>
                    </a>

                    <!-- Product Specific Full Details Box -->
                    <div id="prod-description" class="p-4 bg-neutral-50 border border-neutral-200 rounded-2xl text-xs sm:text-sm text-neutral-700 leading-relaxed">
                        <!-- Dynamic Description -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="max-w-4xl mx-auto w-full px-3 mt-12 pb-8">
        <div class="card-box px-6 py-6 space-y-4 text-left">
            <div class="footer-brand inline-flex items-baseline">
                <span><span class="fb-d">D</span><span class="fb-eserve">eserve</span></span>
                <span class="ml-1.5"><span class="fb-w">W</span><span class="fb-ear">ear</span></span>
            </div>
            <div class="flex flex-col items-start gap-2 max-w-[180px] py-2">
                <a href="products.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">All Products</a>
                <a href="cart.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">Cart</a>
                <a href="orders.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">My Order</a>
                <a href="track.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">Track Order</a>
            </div>
            <div class="pt-2 border-t border-neutral-100">
                <p class="text-xs font-bold tracking-widest text-amber-600 mb-3 uppercase">CONTACTS WITH US</p>
                <div class="flex items-center gap-3">
                    <a href="https://www.facebook.com/profile.php?id=61596776030542" target="_blank" class="flex items-center gap-1.5 bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-medium">🌐 ফেসবুক পেজ</a>
                    <a href="https://wa.me/8801877476659?text=Hello" target="_blank" class="flex items-center gap-1.5 bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-medium">💬 WhatsApp</a>
                </div>
            </div>
            <p class="text-xs text-neutral-400">© 2026 Deserve Wear. All rights reserved.</p>
        </div>
    </footer>

    <script src="products.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id') || "1";
        const currentProduct = (typeof products !== 'undefined') ? (products.find(p => p.id == productId) || products[0]) : { name: "Product", price: 0, images: [], colors: ["Black"], description: "" };

        let selectedSize = 'M';
        let selectedColor = currentProduct.colors && currentProduct.colors.length > 0 ? currentProduct.colors[0] : 'Black';
        let activeImageIndex = 0;

        document.getElementById('page-title').innerText = currentProduct.name + " - Deserve Wear";
        document.getElementById('prod-name').innerText = currentProduct.name;
        document.getElementById('prod-price').innerText = `৳${currentProduct.price}`;
        document.getElementById('prod-description').innerText = currentProduct.description || "এই প্রডাক্ট সম্পর্কে বিস্তারিত কোনো তথ্য দেওয়া হয়নি।";

        if(currentProduct.images && currentProduct.images.length > 0) {
            document.getElementById('prod-img').src = currentProduct.images[0];
            
            // Render Thumbnails for Image Slider (Up to 4 images)
            const thumbContainer = document.getElementById('thumbnail-container');
            currentProduct.images.forEach((imgUrl, index) => {
                thumbContainer.innerHTML += `
                    <button onclick="changeMainImage(${index}, this)" class="thumb-btn flex-shrink-0 w-16 h-20 rounded-xl overflow-hidden border-2 ${index === 0 ? 'border-neutral-900' : 'border-transparent'} bg-neutral-100 transition">
                        <img src="${imgUrl}" class="w-full h-full object-cover">
                    </button>
                `;
            });
        }

        // Render Dynamic Color Options
        const colorContainer = document.getElementById('color-options');
        if(currentProduct.colors && currentProduct.colors.length > 0) {
            document.getElementById('selected-color-text').innerText = currentProduct.colors[0];
            currentProduct.colors.forEach((col, index) => {
                let isFirst = index === 0;
                colorContainer.innerHTML += `
                    <button onclick="selectColor('${col}', this)" class="color-btn px-3 py-2 rounded-xl border ${isFirst ? 'border-neutral-900 bg-neutral-900 text-white' : 'border-neutral-200 text-neutral-700'} text-xs font-medium transition">${col}</button>
                `;
            });
        }

        function changeMainImage(index, btn) {
            activeImageIndex = index;
            document.getElementById('prod-img').src = currentProduct.images[index];
            document.querySelectorAll('.thumb-btn').forEach(b => b.classList.remove('border-neutral-900'));
            b.classList.add('border-neutral-900'); // Note: handled via btn passed
        }

        // Fix for thumbnail border toggle
        window.changeMainImage = function(index, btn) {
            activeImageIndex = index;
            document.getElementById('prod-img').src = currentProduct.images[index];
            document.querySelectorAll('.thumb-btn').forEach(b => b.classList.remove('border-neutral-900', 'border-2'));
            document.querySelectorAll('.thumb-btn').forEach(b => b.classList.add('border', 'border-transparent'));
            btn.classList.remove('border-transparent');
            btn.classList.add('border-2', 'border-neutral-900');
        };

        function selectSize(size, btn) {
            selectedSize = size;
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('border-neutral-900', 'bg-neutral-900', 'text-white'));
            btn.classList.add('border-neutral-900', 'bg-neutral-900', 'text-white');
        }

        function selectColor(color, btn) {
            selectedColor = color;
            document.getElementById('selected-color-text').innerText = color;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('border-neutral-900', 'bg-neutral-900', 'text-white'));
            document.querySelectorAll('.color-btn').forEach(b => b.classList.add('border-neutral-200', 'text-neutral-700'));
            btn.classList.remove('border-neutral-200', 'text-neutral-700');
            btn.classList.add('border-neutral-900', 'bg-neutral-900', 'text-white');
        }

        function addToCart() {
            let cart = JSON.parse(localStorage.getItem('deserve_cart')) || [];
            cart.push({ 
                id: currentProduct.id, 
                name: currentProduct.name, 
                price: currentProduct.price, 
                img: (currentProduct.images && currentProduct.images[activeImageIndex]) ? currentProduct.images[activeImageIndex] : '', 
                size: selectedSize, 
                color: selectedColor, 
                qty: 1 
            });
            localStorage.setItem('deserve_cart', JSON.stringify(cart));
            updateCartBadge();
            alert('কার্টে যোগ করা হয়েছে!');
        }

        function buyNow() {
            addToCart();
            window.location.href = 'cart.html';
        }

        function openChat() {
            const msg = `হ্যালো, আমি "${currentProduct.name}" (রং: ${selectedColor}, সাইজ: ${selectedSize}) প্রোডাক্টটি সম্পর্কে জানতে চাই।`;
            window.open(`https://wa.me/8801877476659?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('deserve_cart')) || [];
            document.getElementById('cart-count').innerText = cart.length;
        }
        updateCartBadge();
    </script>
</body>
</html>
