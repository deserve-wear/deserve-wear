<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অর্ডার ট্র্যাকিং - Deserve Wear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; } 
        .card-box { background: #ffffff; border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05); }
        .footer-brand { font-family: serif; font-style: italic; font-weight: 800; font-size: 1.6rem; }
        .fb-d { color: #dc2626; font-size: 2rem; }
        .fb-eserve { color: #4b5563; }
        .fb-w { color: #2563eb; font-size: 2rem; margin-left: 4px; }
        .fb-ear { color: #d97706; }
    </style>
</head>
<body class="text-neutral-900 antialiased flex flex-col min-h-screen">

    <!-- Header -->
    <header class="sticky top-0 z-50 px-3 pt-3">
        <div class="card-box relative mx-auto flex max-w-4xl items-center justify-between px-4 py-3 bg-white/95 backdrop-blur-md">
            <a href="index.html" class="flex items-center gap-1.5 text-sm font-semibold text-neutral-800 bg-neutral-100 hover:bg-neutral-200 px-3 py-1.5 rounded-xl transition">
                ← Back
            </a>
            <a href="index.html" class="flex items-baseline gap-1.5">
                <span class="italic font-serif text-xl font-bold tracking-tight text-neutral-900">Deserve</span>
                <span class="uppercase text-[8px] tracking-[0.35em] font-sans font-semibold text-amber-600">Wear</span>
            </a>
            <a href="cart.html" class="flex items-center gap-2 bg-neutral-100 hover:bg-neutral-200 px-3.5 py-2 rounded-full text-sm font-medium transition">
                <span>কার্ট</span>
                <span id="cart-count" class="bg-amber-600 text-white text-xs px-1.5 py-0.5 rounded-full">0</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-3 py-8 flex-1 w-full space-y-6">
        <div class="card-box p-6 sm:p-8 bg-white max-w-lg mx-auto">
            <h1 class="text-2xl font-bold mb-2">অর্ডার ট্র্যাক করুন</h1>
            <p class="text-xs text-neutral-500 mb-6">আপনার অর্ডার আইডি এবং মোবাইল নম্বর দিয়ে বর্তমান অবস্থা যাচাই করুন।</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-neutral-600 mb-1">অর্ডার আইডি (যেমন: DSV-1001 বা My Order থেকে নিন)</label>
                    <input type="text" id="track-id" placeholder="উদা: DSV-1001" class="w-full bg-neutral-100 px-4 py-3 rounded-xl text-sm border-none focus:ring-1 focus:ring-neutral-900">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-neutral-600 mb-1">মোবাইল নম্বর</label>
                    <input type="text" id="track-phone" placeholder="017xxxxxxxx" class="w-full bg-neutral-100 px-4 py-3 rounded-xl text-sm border-none focus:ring-1 focus:ring-neutral-900">
                </div>
                <button onclick="trackOrder()" class="w-full bg-neutral-900 text-white py-3.5 rounded-2xl font-semibold text-sm hover:bg-neutral-800 transition shadow-md">
                    স্ট্যাটাস খুঁজুন
                </button>
            </div>

            <!-- Result Box -->
            <div id="track-result" class="mt-6 hidden border-t pt-6 space-y-4">
                <!-- Dynamic status loads here -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto w-full px-3 mt-12 pb-8">
        <div class="card-box px-6 py-6 space-y-4 text-left">
            <div class="footer-brand inline-flex items-baseline">
                <span><span class="fb-d">D</span><span class="fb-eserve">eserve</span></span>
                <span class="ml-1.5"><span class="fb-w">W</span><span class="fb-ear">ear</span></span>
            </div>
            <div class="flex flex-col items-start gap-2 max-w-[180px] py-2">
                <a href="index.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">All Products</a>
                <a href="cart.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">Cart</a>
                <a href="orders.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">My Order</a>
                <a href="track.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">Track Order</a>
            </div>
            <div class="pt-2 border-t border-neutral-100">
                <p class="text-xs font-bold tracking-widest text-amber-600 mb-3 uppercase">CONTACTS WITH US</p>
                <div class="flex items-center gap-3">
                    <a href="https://www.facebook.com/profile.php?id=61596776030542" target="_blank" class="flex items-center gap-1.5 bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-medium">🌐 ফেসবুক পেজ</a>
                    <a href="https://wa.me/8801877476659?text=Hello" target="_blank" class="flex items-center gap-1.5 bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-medium">💬 WhatsApp</a>
                </div>
            </div>
            <p class="text-xs text-neutral-400">© 2026 Deserve Wear. All rights reserved.</p>
        </div>
    </footer>

    <script>
        function trackOrder() {
            const orderId = document.getElementById('track-id').value.trim();
            const phone = document.getElementById('track-phone').value.trim();
            const resultDiv = document.getElementById('track-result');

            if(!orderId || !phone) {
                alert('দয়া করে অর্ডার আইডি এবং মোবাইল নম্বর দিন।');
                return;
            }

            // Check local storage orders
            let orders = JSON.parse(localStorage.getItem('deserve_orders')) || [];
            let foundOrder = orders.find(o => o.phone === phone);

            // Time logic simulation (calculates based on current time vs simulated order time)
            let currentTime = new Date().getTime();
            // If order exists in storage, we can use its timestamp, otherwise simulate based on input ID
            let orderTime = foundOrder ? (foundOrder.timestamp || currentTime - 3600000) : (currentTime - 7200000); 
            let hoursPassed = (currentTime - orderTime) / (1000 * 60 * 60);

            let statusText = "";
            let statusBadge = "";
            let step1 = "opacity-40", step2 = "opacity-40", step3 = "opacity-40";

            if (hoursPassed < 2) {
                statusBadge = "🟡 Pending (প্যাকেজিং চলছে)";
                statusText = "আপনার অর্ডারটি সফলভাবে গৃহিত হয়েছে এবং ওয়্যারহাউসে প্যাকেজিং প্রক্রিয়া চলছে।";
                step1 = "opacity-100 font-bold text-amber-600";
            } else if (hoursPassed >= 2 && hoursPassed < 24) {
                statusBadge = "🚀 Shipped (কুরিয়ারে হস্তান্তর)";
                statusText = "পার্সেলটি কুরিয়ার সার্ভিসের নিকট হস্তান্তর করা হয়েছে। ডেলিভারি হাবে পৌঁছানোর পথে রয়েছে।";
                step1 = "opacity-100 text-emerald-600";
                step2 = "opacity-100 font-bold text-amber-600";
            } else {
                statusBadge = "✅ Out for Delivery (ডেলিভারির জন্য বের হয়েছে)";
                statusText = "আপনার এলাকার ডেলিভারি ম্যানের কাছে পার্সেলটি রয়েছে, আজকেই ডেলিভারি পেয়ে যাবেন।";
                step1 = "opacity-100 text-emerald-600";
                step2 = "opacity-100 text-emerald-600";
                step3 = "opacity-100 font-bold text-emerald-600";
            }

            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = `
                <div class="bg-neutral-50 p-4 rounded-2xl border space-y-3">
                    <div class="flex justify-between items-center text-xs border-b pb-2">
                        <span class="font-bold">অর্ডার আইডি: ${orderId}</span>
                        <span class="px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 font-semibold">${statusBadge}</span>
                    </div>
                    <p class="text-xs text-neutral-600">${statusText}</p>
                    <div class="pt-2 border-t space-y-1 text-xs">
                        <p class="${step1}">1. অর্ডার কনফার্ম ও প্যাকেজিং</p>
                        <p class="${step2}">2. কুরিয়ারে শিফট করা হয়েছে</p>
                        <p class="${step3}">3. হোম ডেলিভারি সম্পন্ন</p>
                    </div>
                </div>
            `;
        }

        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('deserve_cart')) || [];
            document.getElementById('cart-count').innerText = cart.length;
        }
        updateCartBadge();
    </script>
</body>
</html>
