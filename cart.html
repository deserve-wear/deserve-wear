<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart & Checkout - Deserve Wear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; } 
        .card-box { background: #ffffff; border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05); }
        .brand-logo { font-family: serif; font-style: italic; font-weight: 800; font-size: 1.4rem; letter-spacing: -0.5px; }
        .brand-d { color: #dc2626; font-size: 1.7rem; }
        .brand-eserve { color: #4b5563; }
        .brand-w { color: #2563eb; font-size: 1.7rem; margin-left: 3px; }
        .brand-ear { color: #d97706; }
    </style>
</head>
<body class="text-neutral-900 antialiased flex flex-col min-h-screen">

    <header class="sticky top-0 z-50 px-3 pt-3">
        <div class="card-box relative mx-auto flex max-w-4xl items-center justify-between px-4 py-3 bg-white/95 backdrop-blur-md">
            <a href="index.html" class="flex items-center gap-1.5 text-sm font-semibold text-neutral-800 bg-neutral-100 hover:bg-neutral-200 px-3 py-1.5 rounded-xl transition">
                ← Back
            </a>
            <a href="index.html" class="brand-logo flex items-baseline">
                <span><span class="brand-d">D</span><span class="brand-eserve">eserve</span></span>
                <span class="ml-1"><span class="brand-w">W</span><span class="brand-ear">ear</span></span>
            </a>
            <span class="font-bold text-sm">শপিং কার্ট</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-3 py-6 flex-1 w-full space-y-6">
        <div class="card-box p-6 bg-white">
            <div class="flex justify-between items-center mb-4 pb-2 border-b">
                <h2 class="text-lg font-bold">কার্ট লিস্ট</h2>
                <button onclick="clearCart()" class="text-red-500 text-xs font-semibold hover:underline">সব ডিলিট করুন</button>
            </div>
            <div id="cart-items-container" class="space-y-4"></div>
        </div>

        <div class="card-box p-6 bg-white space-y-3 text-sm">
            <h2 class="text-lg font-bold pb-2 border-b">অর্ডার সামারি</h2>
            <div class="flex justify-between">
                <span class="text-neutral-600">সাবটোটাল</span>
                <span id="subtotal-val" class="font-semibold">৳০</span>
            </div>
            <div class="flex justify-between">
                <span class="text-neutral-600">ডিসকাউন্ট</span>
                <span class="font-semibold text-emerald-600">-৳০</span>
            </div>
            <div class="py-2 border-y border-neutral-100 space-y-2">
                <label class="block text-xs font-semibold text-neutral-500">ডেলিভারি এলাকা সিলেক্ট করুন:</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center gap-2 p-3 rounded-xl border border-neutral-200 cursor-pointer text-xs font-medium">
                        <input type="radio" name="delivery" value="60" checked onchange="updateTotal()"> ঢাকার ভেতরে (৳৬০)
                    </label>
                    <label class="flex items-center gap-2 p-3 rounded-xl border border-neutral-200 cursor-pointer text-xs font-medium">
                        <input type="radio" name="delivery" value="120" onchange="updateTotal()"> ঢাকার বাইরে (৳১২০)
                    </label>
                </div>
            </div>
            <div class="flex justify-between text-base font-bold pt-2">
                <span>সর্বমোট (Total)</span>
                <span id="grand-total-val" class="text-amber-600">৳০</span>
            </div>
        </div>

        <div class="card-box p-6 bg-white space-y-4">
            <h2 class="text-lg font-bold">ডেলিভারির তথ্য</h2>
            <input type="text" id="cust-name" placeholder="আপনার নাম" class="w-full bg-neutral-100 px-4 py-3 rounded-xl text-sm border-none focus:ring-1 focus:ring-neutral-900">
            <input type="text" id="cust-phone" placeholder="মোবাইল নম্বর (যেমন: 017xxxxxxxx)" class="w-full bg-neutral-100 px-4 py-3 rounded-xl text-sm border-none focus:ring-1 focus:ring-neutral-900">
            <textarea id="cust-address" placeholder="পূর্ণ ঠিকানা (বাসা, এলাকা, থানা, জেলা)" class="w-full bg-neutral-100 px-4 py-3 rounded-xl text-sm border-none focus:ring-1 focus:ring-neutral-900"></textarea>
            
            <button onclick="submitOrder()" class="w-full bg-neutral-900 text-white py-3.5 rounded-2xl font-semibold text-sm hover:bg-neutral-800 transition shadow-md">
                অর্ডার কনফার্ম করুন (Cash on Delivery)
            </button>
        </div>
    </main>

    <footer class="max-w-4xl mx-auto w-full px-3 mt-12 pb-8">
        <div class="card-box px-6 py-6 text-center space-y-4">
            <div class="brand-logo inline-flex items-baseline">
                <span><span class="brand-d">D</span><span class="brand-eserve">eserve</span></span>
                <span class="ml-1.5"><span class="brand-w">W</span><span class="brand-ear">ear</span></span>
            </div>
            <div class="flex flex-col items-start gap-2 max-w-[180px] mx-auto py-2">
                <a href="index.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">All Products</a>
                <a href="cart.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">Cart</a>
                <a href="orders.html" class="w-full text-left bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 px-4 py-2 rounded-xl text-xs font-semibold text-neutral-800 transition shadow-sm">My Order</a>
            </div>
            <div class="pt-2 border-t border-neutral-100">
                <p class="text-xs font-bold tracking-widest text-amber-600 mb-3 uppercase">CONTACTS WITH US</p>
                <div class="flex justify-center items-center gap-4">
                    <a href="https://www.facebook.com/profile.php?id=61596776030542" target="_blank" class="flex items-center gap-1.5 bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-medium">🌐 ফেসবুক পেজ</a>
                    <a href="https://wa.me/8801877476659?text=Hello" target="_blank" class="flex items-center gap-1.5 bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-medium">💬 WhatsApp</a>
                </div>
            </div>
            <p class="text-xs text-neutral-400">© 2026 Deserve Wear.</p>
        </div>
    </footer>

    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('deserve_cart')) || [];
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';

            if(cart.length === 0) {
                container.innerHTML = '<p class="text-sm text-neutral-400 text-center py-6">আপনার কার্ট খালি</p>';
                document.getElementById('subtotal-val').innerText = '৳০';
                document.getElementById('grand-total-val').innerText = '৳০';
                return;
            }

            let subtotal = 0;
            cart.forEach((item, index) => {
                subtotal += item.price * (item.qty || 1);
                container.innerHTML += `
                    <div class="flex items-center justify-between bg-neutral-50 p-4 rounded-2xl border border-neutral-100">
                        <div class="flex items-center gap-3">
                            <img src="${item.img}" class="w-14 h-16 object-cover rounded-xl">
                            <div>
                                <h4 class="font-bold text-sm">${item.name}</h4>
                                <p class="text-xs text-neutral-500">কালার: ${item.color} | সাইজ: ${item.size}</p>
                                <p class="text-xs font-bold mt-1 text-amber-600">৳${item.price}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="flex items-center border bg-white rounded-xl overflow-hidden">
                                <button onclick="changeQty(${index}, -1)" class="px-2.5 py-1 text-xs hover:bg-neutral-100">-</button>
                                <span class="px-2.5 text-xs font-semibold">${item.qty || 1}</span>
                                <button onclick="changeQty(${index}, 1)" class="px-2.5 py-1 text-xs hover:bg-neutral-100">+</button>
                            </div>
                            <button onclick="removeItem(${index})" class="text-red-500 text-xs font-semibold p-2">✕</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('subtotal-val').innerText = `৳${subtotal}`;
            updateTotal();
        }

        function changeQty(index, delta) {
            let cart = JSON.parse(localStorage.getItem('deserve_cart')) || [];
            cart[index].qty = (cart[index].qty || 1) + delta;
            if(cart[index].qty < 1) cart[index].qty = 1;
            localStorage.setItem('deserve_cart', JSON.stringify(cart));
            loadCart();
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('deserve_cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('deserve_cart', JSON.stringify(cart));
            loadCart();
        }

        function clearCart() {
            localStorage.removeItem('deserve_cart');
            loadCart();
        }

        function updateTotal() {
            let cart = JSON.parse(localStorage.getItem('deserve_cart')) || [];
            let subtotal = cart.reduce((sum, item) => sum + (item.price * (item.qty || 1)), 0);
            let deliveryFee = parseInt(document.querySelector('input[name="delivery"]:checked').value);
            let grandTotal = subtotal + deliveryFee;
            document.getElementById('grand-total-val').innerText = `৳${grandTotal}`;
        }

        function submitOrder() {
            let cart = JSON.parse(localStorage.getItem('deserve_cart')) || [];
            if(cart.length === 0) {
                alert('আপনার কার্ট খালি!');
                return;
            }

            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;
            const deliveryFee = parseInt(document.querySelector('input[name="delivery"]:checked').value);

            if(!name || !phone || !address) {
                alert('দয়া করে আপনার নাম, ফোন নম্বর ও পূর্ণ ঠিকানা দিন।');
                return;
            }

            let subtotal = cart.reduce((sum, item) => sum + (item.price * (item.qty || 1)), 0);
            let total = subtotal + deliveryFee;

            // Save to Orders history list for "My Order" page
            let orders = JSON.parse(localStorage.getItem('deserve_orders')) || [];
            orders.unshift({ name, phone, address, items: cart, total });
            localStorage.setItem('deserve_orders', JSON.stringify(orders));

            let orderText = `🛍️ নতুন অর্ডার (Deserve Wear)%0A%0A👤 নাম: ${name}%0A📞 ফোন: ${phone}%0A📍 ঠিকানা: ${address}%0A%0A📦 প্রোডাক্টসমূহ:%0A`;
            cart.forEach((item, i) => {
                orderText += `${i+1}. ${item.name} (${item.color}, সাইজ: ${item.size}) x ${item.qty || 1} - ৳${item.price * (item.qty || 1)}%0A`;
            });
            orderText += `%0A🚚 ডেলিভারি চার্জ: ৳${deliveryFee}%0A💰 সর্বমোট: ৳${total}`;

            const ownerWhatsApp = "8801877476659";
            const apiURL = `https://wa.me/${ownerWhatsApp}?text=${orderText}`;
            
            window.open(apiURL, '_blank');

            localStorage.removeItem('deserve_cart');
            alert('আপনার অর্ডারটি সফলভাবে কনফার্ম হয়েছে!');
            window.location.href = 'orders.html';
        }

        loadCart();
    </script>
</body>
</html>
